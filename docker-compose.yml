version: '3.8'

services:
  swinir:
    networks:
      - diffusers-app_default
    labels:
      - "role=development"
    deploy:
      resources:
        limits:
          memory: 8G
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    entrypoint: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

networks:
  diffusers-app_default:
    external: true